name: Scanner
options:
  bundleIdPrefix: mx.scanner
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Bump CURRENT_PROJECT_VERSION on every App Store Connect upload (ASC rejects a reused build number).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only (PRD: iPhone / iOS)
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM comes from Config/Local.xcconfig (gitignored, per-developer) via the include below.

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  ScannerCore:
    path: Packages/ScannerCore
  CaptureKit:
    path: Packages/CaptureKit
  ImagePipeline:
    path: Packages/ImagePipeline
  Recognition:
    path: Packages/Recognition
  Export:
    path: Packages/Export
  Telemetry:
    path: Packages/Telemetry
  DesignSystem:
    path: Packages/DesignSystem

targets:
  Scanner:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: ScannerCore
      - package: CaptureKit
      - package: ImagePipeline
      - package: Recognition
      - package: Export
      - package: Telemetry
      - package: DesignSystem
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Scanner
        NSCameraUsageDescription: Scanner uses the camera to capture documents. Everything is processed on your iPhone; nothing is uploaded.
        NSFaceIDUsageDescription: Scanner uses Face ID to unlock your scans when you turn on the app lock.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.scanner.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ScannerTests
    dependencies:
      - target: Scanner
      - package: ScannerCore
      - package: ImagePipeline
      - package: Recognition
      - package: Export
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.scanner.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Scanner:
    build:
      targets:
        Scanner: all
        ScannerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScannerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
